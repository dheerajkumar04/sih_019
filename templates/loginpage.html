<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduNabha</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            font-size: 3rem;
            color: #667eea;
        }
        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #667eea;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        .form-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1001;
        }
        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        .notification.error {
            border-left: 4px solid #ff6b6b;
        }
        .notification-icon {
            font-size: 1.5rem;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <div class="logo-text">EduNabha</div>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="form-footer">
            Don't have an account? <a href="#">Contact Administrator</a>
        </div>
    </div>

    <div class="notification" id="notification">
        <div class="notification-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="notification-message">
            Invalid username or password
        </div>
    </div>

    <script>
        // Initialize teachers data if not exists
        if (!localStorage.getItem('eduNabhaTeachers')) {
            const teachers = [
                {
                    id: 'teacher_1',
                    username: 'teacher1',
                    password: 'password1',
                    totalPoints: 150,
                    activeClasses: 3,
                    totalStudents: 64,
                    pendingAssignments: 5,
                    studentGrades: [85, 92, 78, 88, 95, 90, 82, 96, 89],
                    courseCompletion: 75,
                    studentEngagement: 82
                },
                {
                    id: 'teacher_2',
                    username: 'teacher2',
                    password: 'password2',
                    totalPoints: 120,
                    activeClasses: 2,
                    totalStudents: 42,
                    pendingAssignments: 3,
                    studentGrades: [78, 85, 92, 88, 76, 82, 90, 85],
                    courseCompletion: 68,
                    studentEngagement: 75
                }
            ];
            localStorage.setItem('eduNabhaTeachers', JSON.stringify(teachers));
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const teachers = JSON.parse(localStorage.getItem('eduNabhaTeachers') || '[]');
            const teacher = teachers.find(t => t.username === username && t.password === password);
            
            if (teacher) {
                localStorage.setItem('currentTeacher', JSON.stringify(teacher));
                window.location.href = 'dashboard.html';
            } else {
                showNotification('Invalid username or password', 'error');
            }
        });
        
        function showNotification(message, type = 'error') {
            const notification = document.getElementById('notification');
            const notificationMessage = notification.querySelector('.notification-message');
            
            notificationMessage.textContent = message;
            notification.className = 'notification ' + type;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
